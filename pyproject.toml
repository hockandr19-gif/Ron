[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ron"
version = "0.1.0"
description = "Crypto day trading system: backtester, signals dashboard, and live bot"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "ta>=0.11.0",
    "numpy>=1.26",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "click>=8.1",
    "sqlalchemy>=2.0",
    "aiohttp>=3.9",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "black>=24.4",
    "ruff>=0.4",
]

[project.scripts]
ron-backtest  = "ron.cli:backtest"
ron-trade     = "ron.cli:trade"
ron-dashboard = "ron.cli:dashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
